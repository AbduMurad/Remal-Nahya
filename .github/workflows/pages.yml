name: Build, test and deploy

# Static export, so there is no Node runtime in production — the artifact is
# plain files. Deploys only if typecheck, build and the Playwright suite pass.
#
# One-time setup: Settings → Pages → Source → GitHub Actions.
# If the repo is served from a subpath (user.github.io/REPO), NEXT_PUBLIC_BASE_PATH
# below must match the repo name.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # '' when served from a custom domain or a user/organisation root site
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # src/content/images.json is generated, and typecheck imports it — so the
      # grade has to run before tsc, not as part of the build that follows it
      - name: Grade and encode photography
        run: npm run assets

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test — 12 pages, RTL, catalogue, form, wellbore, bottom bar
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false      # never interrupt a deploy in flight
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
